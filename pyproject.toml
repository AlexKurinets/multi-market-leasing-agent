[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-market-leasing-agent"
version = "0.1.0"
description = "Reference implementation of a multi-market AI leasing agent: market-scoped data, tool-grounded answers, durable follow-up, CRM write-back and validated market briefs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "anthropic>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic-settings>=2.4",
  "temporalio>=1.8",
  "twilio>=9.0",
  "httpx>=0.27",
  "phonenumbers>=8.13",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
leasing = "leasing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leasing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM905"]
